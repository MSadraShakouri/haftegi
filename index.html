<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامه‌ساز هفتگی</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--card:#fff;--ink:#1e293b;--ink2:#64748b;--ink3:#94a3b8;
  --line:#e2e8f0;--line2:#cbd5e1;--fill:#f1f5f9;--accent:#1e293b;
  --r:12px;--rs:8px;
}
html,body{overflow-x:hidden}
body{
  font-family:'Vazirmatn',Tahoma,Arial,sans-serif;font-weight:300;
  background:var(--bg);background-image:radial-gradient(circle at 50% 0%,#fff 0%,var(--bg) 70%);
  min-height:100vh;color:var(--ink);
}
.app{display:grid;grid-template-columns:320px 1fr;gap:20px;max-width:1400px;margin:0 auto;padding:24px;min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:14px;gap:14px}.sidebar{order:2;position:static!important}.main{order:1}}
.sidebar{
  background:var(--card);border-radius:var(--r);padding:18px;
  box-shadow:0 10px 30px -5px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.02);
  display:flex;flex-direction:column;gap:20px;height:fit-content;position:sticky;top:24px;
}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.sec h2 span{color:var(--ink3);font-weight:400;text-transform:none;letter-spacing:0}
.btn-row{display:flex;flex-direction:column;gap:6px}
.btn{padding:10px 14px;border:none;border-radius:var(--rs);font-family:inherit;font-size:.83rem;font-weight:500;cursor:pointer;transition:.15s ease;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#0f172a}
.btn-secondary{background:var(--fill);color:var(--ink)}
.btn-secondary:hover{background:var(--line)}
.palette-list{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.palette-row{display:flex;flex-direction:column;gap:5px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;border:1px solid var(--line);transition:.15s ease;background:var(--card)}
.palette-row:hover{background:var(--fill)}
.palette-row.active{background:var(--fill);border-color:var(--ink3)}
.palette-name{font-size:.76rem;font-weight:500;color:var(--ink)}
.palette-dots{display:flex;gap:3px}
.palette-dot{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.preset-list{display:flex;flex-wrap:wrap;gap:6px}
.preset-btn{padding:5px 10px;border:1px solid var(--line);background:var(--card);border-radius:14px;font-family:inherit;font-size:.72rem;color:var(--ink2);cursor:pointer;transition:.15s ease}
.preset-btn:hover{background:var(--fill);color:var(--ink);border-color:var(--line2)}
.header-list{list-style:none;display:flex;flex-direction:column;gap:5px;max-height:200px;overflow-y:auto;padding:2px}
.header-item{display:flex;gap:5px;align-items:center}
.header-input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:.8rem;color:var(--ink);background:var(--card);outline:none}
.header-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(30,41,59,.1)}
.icon-btn{width:28px;height:28px;border:none;border-radius:6px;background:transparent;color:var(--ink3);cursor:pointer;font-size:1.1rem;line-height:1;flex-shrink:0;transition:.15s ease}
.icon-btn:hover{background:#fee2e2;color:#dc2626}
.class-list{list-style:none;display:flex;flex-direction:column;gap:5px;max-height:320px;overflow-y:auto;padding:2px}
.class-item{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:var(--rs);background:var(--fill);border:1px solid var(--line);font-size:.83rem}
.class-dot{width:16px;height:16px;border-radius:4px;flex-shrink:0;cursor:pointer;padding:0;border:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);transition:.12s ease}
.class-dot:hover{transform:scale(1.18)}
.class-dot.unassigned{background:repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 3px,#e2e8f0 3px,#e2e8f0 6px)}
.class-name{flex:1;outline:none;padding:2px 6px;border-radius:4px;cursor:text;min-width:0;word-break:break-word;transition:.15s}
.class-name:hover{background:rgba(0,0,0,.03)}
.class-name:focus{background:#fff;box-shadow:0 0 0 2px var(--accent)}
.class-count{font-size:.68rem;color:var(--ink2);background:var(--card);padding:2px 7px;border-radius:10px;flex-shrink:0;border:1px solid var(--line)}
.empty-classes{font-size:.78rem;color:var(--ink3);text-align:center;padding:18px;font-style:italic}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.page-title{font-size:1.5rem;font-weight:600;text-align:center}
.page-subtitle{font-size:.83rem;color:var(--ink2);text-align:center;margin-top:-8px}
.planner-card{
  background:#fff;border-radius:var(--r);padding:10px;
  box-shadow:0 10px 30px -5px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.02);
  overflow:hidden;
}
.seg{display:flex;background:var(--fill);border-radius:var(--rs);padding:3px;gap:2px}
.seg button{flex:1;border:none;background:transparent;font-family:inherit;font-size:.75rem;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--ink2);transition:.15s ease;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.check-row{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--ink2);cursor:pointer;user-select:none;padding:2px}
.check-row input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex-shrink:0}
.hint{font-size:.67rem;color:var(--ink3);line-height:1.7;text-align:center;padding:0 2px}

.planner-table{width:100%;border-collapse:collapse;table-layout:fixed;text-align:center}
.planner-table th{
  background:var(--fill);color:#475569;font-weight:500;
  font-size:.95rem;
  padding:18px 8px;
  border:1px solid var(--line);border-bottom:2px solid var(--line2);
  overflow:hidden;text-overflow:ellipsis;
}
.planner-table td{border:1px solid var(--line);padding:0;position:relative}
.day-cell{
  background:var(--fill);font-weight:500;
  font-size:1.05rem;
  padding:20px 8px;
  vertical-align:middle;color:var(--ink);overflow:hidden;text-overflow:ellipsis;
}
.data-cell{height:95px;background:#fafafa;transition:background-color .2s}
.data-cell.is-empty{
  background-image:repeating-linear-gradient(45deg,transparent,transparent 8px,rgba(0,0,0,.015) 8px,rgba(0,0,0,.015) 16px);
}
.cell-input{
  position:absolute;inset:0;width:100%;height:100%;border:none;background:transparent;
  font-family:inherit;
  font-size:1rem;
  font-weight:400;
  text-align:center;padding:8px;
  outline:none;cursor:text;direction:rtl;transition:color .2s;
  text-overflow:ellipsis;
}
.cell-input::placeholder{color:var(--line2);font-weight:300}
@media(max-width:900px){
  .planner-table th{padding:11px 4px;font-size:.78rem}
  .day-cell{font-size:.82rem;padding:12px 4px}
  .data-cell{height:72px}
  .cell-input{font-size:.78rem;padding:4px}
  .page-title{font-size:1.15rem}
}

.autocomplete{position:fixed;background:#fff;border:1px solid var(--line);border-radius:var(--rs);box-shadow:0 10px 30px rgba(0,0,0,.12);max-height:220px;overflow-y:auto;z-index:1000;display:none;padding:4px}
.autocomplete-item{padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:.8rem;border-radius:6px;direction:rtl}
.autocomplete-item:hover,.autocomplete-item.active{background:var(--fill)}
.autocomplete-color{width:12px;height:12px;border-radius:3px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.autocomplete-name{flex:1;text-align:right;word-break:break-word}
.autocomplete-item mark{background:#fef3c7;color:inherit;border-radius:2px;padding:0 1px}
.color-picker{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:10px;z-index:2000;display:none}
.color-picker-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.color-swatch{width:26px;height:26px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:transform .12s ease;padding:0}
.color-swatch:hover{transform:scale(1.12)}
.color-swatch.active{border-color:var(--accent);transform:scale(1.08)}
.color-picker-footer{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:center}
.unassign-btn{background:var(--fill);border:none;padding:6px 14px;border-radius:6px;font-family:inherit;font-size:.73rem;color:var(--ink2);cursor:pointer;transition:.15s}
.unassign-btn:hover{background:var(--line);color:var(--ink)}
.toast-stack{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:5000;pointer-events:none;align-items:center}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:.82rem;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);transition:.25s ease;pointer-events:auto;max-width:340px;text-align:center}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:#166534}
.toast.error{background:#991b1b}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:3000;opacity:0;transition:opacity .2s;backdrop-filter:blur(4px)}
.modal-overlay.show{opacity:1}
.modal{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);transform:scale(.95);transition:transform .2s}
.modal-overlay.show .modal{transform:scale(1)}
.modal p{font-size:.88rem;margin-bottom:18px;line-height:1.6}
.modal-actions{display:flex;gap:8px}

/* ==== Export preview modal ==== */
.export-modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.65);backdrop-filter:blur(6px);
  z-index:4000;display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;
}
.export-modal-overlay.show{opacity:1;visibility:visible}
.export-modal{
  background:#fff;border-radius:16px;width:100%;max-width:900px;max-height:94vh;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
  transform:scale(.97);transition:transform .2s;
}
.export-modal-overlay.show .export-modal{transform:scale(1)}
.export-modal-head{
  padding:14px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.export-modal-head h3{font-size:.95rem;font-weight:600;flex:1;min-width:100px}
.export-modal-body{
  flex:1;min-height:0;overflow:auto;background:#e2e8f0;
  padding:22px;display:flex;justify-content:center;align-items:flex-start;
}
.export-preview-wrap{display:flex;justify-content:center;align-items:flex-start}
.export-preview-holder{position:relative;box-shadow:0 12px 40px rgba(0,0,0,.18);background:#fff}
.export-modal-foot{
  padding:12px 18px;border-top:1px solid var(--line);
  display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;
}
.export-modal-foot .btn{flex:0 0 auto;padding:9px 16px;font-size:.82rem}
@media(max-width:600px){
  .export-modal-head{gap:8px}
  .export-modal-body{padding:12px}
  .export-modal-foot .btn{flex:1 1 100%}
}

/* ============================================================
   EXPORT DOCUMENT — off-screen render, fixed A4 page
   ============================================================ */
.export-stage{position:fixed;top:0;left:-20000px;pointer-events:none;z-index:-1}

.export-page{
  display:block;background:#fff;box-sizing:border-box;direction:rtl;
  font-family:'Vazirmatn',Tahoma,Arial,sans-serif;color:#1e293b;
  overflow:hidden;
}
.export-page,.export-page *{
  -webkit-print-color-adjust:exact !important;
  print-color-adjust:exact !important;
}

.export-head{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1mm;
}
.export-head-title{font-size:15pt;font-weight:600;color:#1e293b;line-height:1.2}
.export-head-date{font-size:9pt;font-weight:400;color:#64748b;line-height:1.2}

.export-table{
  width:100%;border-collapse:collapse;table-layout:fixed;text-align:center;
  font-size:14px;
}
.export-table th{
  background:#f8fafc;color:#475569;font-weight:500;font-size:.95em;
  border:1px solid #e2e8f0;border-bottom:1.5px solid #cbd5e1;
  padding:2mm 1.5mm;vertical-align:middle;
  word-break:break-word;line-height:1.3;
}
.export-table td{
  border:1px solid #e2e8f0;
  padding:2mm 1.5mm;vertical-align:middle;
  word-break:break-word;line-height:1.35;
}
.export-corner{font-size:.95em}
.export-day{
  background:#f8fafc;color:#1e293b;font-weight:500;
  font-size:1.12em;white-space:nowrap;
}
.export-cell{font-size:1em;font-weight:400}

/* ============================================================
   PRINT — one page, correct orientation, no browser furniture
   ============================================================ */
@media print{
  html,body{
    margin:0 !important;padding:0 !important;
    background:#fff !important;overflow:visible !important;
    width:auto !important;height:auto !important;
  }
  body > *:not(#exportStage){display:none !important}

  #exportStage{
    position:static !important;left:auto !important;top:auto !important;
    display:block !important;pointer-events:auto !important;
    margin:0 !important;padding:0 !important;z-index:auto !important;
  }
  .export-page{
    margin:0 !important;
    box-shadow:none !important;
    page-break-after:avoid !important;
    page-break-inside:avoid !important;
    break-inside:avoid !important;
    break-after:avoid !important;
  }
  .export-table{page-break-inside:avoid !important}
  .export-table tr{page-break-inside:avoid !important}
}
</style>

<!-- Static print page rule. JS only rewrites its content, which browsers
     handle far more reliably than injecting a whole new <style> tag. -->
<style id="printPageRule" media="print">@page { size: A4 portrait; margin: 0; }</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="btn-row">
      <button class="btn btn-primary" id="randomBtn">🎲 رنگ‌بندی تصادفی</button>
      <button class="btn btn-secondary" id="clearBtn">🗑️ پاک کردن همه</button>
    </div>

    <div class="sec">
      <h2>خروجی</h2>
      <div class="btn-row">
        <button class="btn btn-primary" id="exportOpenBtn">📤 پیش‌نمایش و خروجی</button>
      </div>
      <p class="hint">پیش‌نمایش A4، سپس چاپ / ذخیره PDF یا دانلود PNG با کیفیت ۳۰۰ dpi.</p>
    </div>

    <div class="sec">
      <h2>پالت رنگ</h2>
      <ul class="palette-list" id="paletteList"></ul>
    </div>
    <div class="sec">
      <h2>ستون‌ها</h2>
      <div class="preset-list" id="presetList"></div>
      <ul class="header-list" id="headerList"></ul>
      <button class="btn btn-secondary" id="addHeaderBtn" style="font-size:.78rem;padding:7px">+ افزودن ستون</button>
    </div>
    <div class="sec">
      <h2>کلاس‌ها <span id="classCount"></span></h2>
      <ul class="class-list" id="classList"></ul>
    </div>
  </aside>

  <main class="main">
    <h1 class="page-title">برنامه‌ساز هفتگی</h1>
    <p class="page-subtitle">نام کلاس‌ها را در جدول وارد کنید. با تایپ کردن، پیشنهادها نمایش داده می‌شوند.</p>
    <div class="planner-card">
      <table class="planner-table">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Export preview modal -->
<div class="export-modal-overlay" id="exportModal">
  <div class="export-modal" role="dialog" aria-modal="true">
    <div class="export-modal-head">
      <h3>پیش‌نمایش خروجی</h3>
      <div class="seg" id="modalOrientSeg">
        <button type="button" data-v="auto">خودکار</button>
        <button type="button" data-v="portrait">عمودی</button>
        <button type="button" data-v="landscape">افقی</button>
      </div>
      <label class="check-row"><input type="checkbox" id="modalTitleToggle"> عنوان و تاریخ</label>
    </div>
    <div class="export-modal-body">
      <div class="export-preview-wrap" id="exportPreviewWrap"></div>
    </div>
    <div class="export-modal-foot">
      <button class="btn btn-secondary" id="modalCloseBtn">بستن</button>
      <button class="btn btn-secondary" id="modalPngBtn">🖼️ PNG (۳۰۰ dpi)</button>
      <button class="btn btn-primary" id="modalPrintBtn">🖨️ چاپ / ذخیره PDF</button>
    </div>
  </div>
</div>

<div class="autocomplete" id="autocomplete"></div>
<div class="color-picker" id="colorPicker"></div>
<div class="toast-stack" id="toastStack"></div>

<script>
const DAYS = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه'];

const PALETTES = {
  Pastel:  { label:'پاستل',    colors:['#B9FBC0','#FFDAB9','#E6C6FF','#B2EBF2','#FFB3B3','#FFF7A0','#C2CAFF','#A8E8D8','#FFB3D9','#E2FFA8'] },
  Vibrant: { label:'وایبرنت',  colors:['#5BDB6D','#FF9E54','#C67CFF','#54D9E8','#FF6B6B','#FFE84D','#8A9CFF','#5CE8C5','#FF6BB5','#B8FF4D'] },
  Neon:    { label:'نئون',     colors:['#00FF55','#FF7A00','#B000FF','#00E5FF','#FF0000','#FFFF00','#4D6AFF','#00FFB3','#FF00A0','#AAFF00'] },
  Dark:    { label:'تیره',     colors:['#2B5C33','#8B5A2B','#5B3A7A','#2B5B66','#8B3A3A','#7A6B2B','#3A447A','#2B6654','#8B3A66','#5B7A2B'] },
  Muted:   { label:'مات',      colors:['#8DA98F','#C4A48E','#A99BB8','#8EA4A8','#B88E8E','#B8B08A','#98A0B8','#8EA8A0','#B88EA3','#A3B88E'] },
  Retro:   { label:'رترو',     colors:['#C4A484','#D4A373','#9E7B9E','#6B8E8E','#A85D5D','#B8B06D','#8A8AA8','#7A9E7A','#B86B8E','#8A9E6B'] },
  Jewel:   { label:'جواهر',    colors:['#1E8A5A','#B33A3A','#6A3A9E','#3A6A9E','#C44A2A','#D4A02A','#5A6A9E','#2A8A7A','#B33A6A','#7A8A2A'] },
  Candy:   { label:'آب‌نباتی', colors:['#FF85C0','#FFAB85','#D4A0FF','#85D4FF','#FF6B6B','#FFE34D','#8A9CFF','#5CE8C5','#FF6BB5','#AAFF00'] },
};

const PRESETS = [
  { label:'تایم',     headers:['تایم ۱','تایم ۲','تایم ۳','تایم ۴'] },
  { label:'۲۴ ساعته', headers:['۸:۰۰-۱۰:۰۰','۱۰:۰۰-۱۲:۰۰','۱۳:۳۰-۱۵:۳۰','۱۵:۳۰-۱۷:۳۰'] },
  { label:'۱۲ ساعته', headers:['۸:۰۰-۱۰:۰۰','۱۰:۰۰-۱۲:۰۰','۱:۳۰-۳:۳۰','۳:۳۰-۵:۳۰'] },
];

const A4 = { portrait:{ w:210, h:297 }, landscape:{ w:297, h:210 } };
const MARGIN = 10;
/* 2mm slack + overflow:hidden on the page = guaranteed single page in
   every browser. Browsers add sub-pixel rounding; without slack the
   content spills onto a second page even when it "fits" mathematically. */
const PAGE_SLACK = 2;
const TITLE_BLOCK = 15;
const PNG_SHORT_EDGE = 2480;

const SETTINGS_KEY = 'planner.export.v2';

const S = {
  headers:[...PRESETS[0].headers],
  grid:[],
  colors:{},
  palette:'Pastel',
  orientation:'auto',
  exportTitle:false,
};
S.grid = DAYS.map(() => S.headers.map(() => ''));

(function loadSettings(){
  try{
    const raw = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    if(['auto','portrait','landscape'].includes(raw.orientation)) S.orientation = raw.orientation;
    if(typeof raw.exportTitle === 'boolean') S.exportTitle = raw.exportTitle;
  }catch(_){}
})();
function saveSettings(){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify({ orientation:S.orientation, exportTitle:S.exportTitle })); }catch(_){}
}

let lastFocusTime = 0;
let hideTimer = null;

const $ = id => document.getElementById(id);
const enforcePersian = s => String(s).replace(/ك/g,'ک').replace(/[يى]/g,'ی');
const normalizeForSearch = s => enforcePersian(s).replace(/[آأإ]/g,'ا').replace(/ة/g,'ه').toLowerCase().trim();
const escapeHtml = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paletteColors = () => PALETTES[S.palette].colors;
const classNames = () => Object.keys(S.colors);

function hexToRgb(hex){return{r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)}}
function rgbToHsl(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  let h,s,l=(mx+mn)/2;
  if(mx===mn){h=s=0}
  else{
    const d=mx-mn;
    s=l>.5?d/(2-mx-mn):d/(mx+mn);
    switch(mx){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break}
    h/=6;
  }
  return{h:h*360,s:s*100,l:l*100};
}
function hslToHex(h,s,l){
  h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs(((h/60)%2)-1)),m=l-c/2;
  let r,g,b;
  if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];
  else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];
  const toHex=v=>Math.round((v+m)*255).toString(16).padStart(2,'0');
  return`#${toHex(r)}${toHex(g)}${toHex(b)}`;
}
function textColorFor(hex){
  if(!hex)return'#1e293b';
  const{r,g,b}=hexToRgb(hex);
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  const{h,s}=rgbToHsl(r,g,b);
  return lum>0.55 ? hslToHex(h,Math.min(s+10,55),24) : hslToHex(h,Math.min(s,40),93);
}
function usedColors(except){const u=new Set();for(const[k,v]of Object.entries(S.colors))if(v&&k!==except)u.add(v);return u}
function nextColor(){const u=usedColors();return paletteColors().find(c=>!u.has(c))||null}
function cleanupOrphans(){const used=new Set();S.grid.forEach(r=>r.forEach(v=>v&&used.add(v)));for(const k of Object.keys(S.colors))if(!used.has(k))delete S.colors[k]}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function persianDateLong(){
  try{ return new Intl.DateTimeFormat('fa-IR',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date()); }
  catch(_){ return ''; }
}
function dateStamp(){
  try{
    return new Intl.DateTimeFormat('fa-IR-u-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'})
      .format(new Date()).replace(/\//g,'-');
  }catch(_){ return new Date().toISOString().slice(0,10); }
}

function notify(msg,type=''){
  const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;
  $('toastStack').appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)},2600);
}
function confirmDialog(msg,ok='بله',cancel='لغو'){
  return new Promise(res=>{
    const ov=document.createElement('div');ov.className='modal-overlay';
    ov.innerHTML=`<div class="modal"><p>${escapeHtml(msg)}</p><div class="modal-actions"><button class="btn btn-primary" data-act="yes">${ok}</button><button class="btn btn-secondary" data-act="no">${cancel}</button></div></div>`;
    document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('show'));
    ov.addEventListener('click',e=>{const a=e.target.dataset.act;if(!a)return;ov.classList.remove('show');setTimeout(()=>ov.remove(),200);res(a==='yes')});
  });
}

/* ============================================================
   Live table
   ============================================================ */
function buildTable(){
  $('tableHead').innerHTML='<tr><th>روز / ستون</th>'+S.headers.map((h,i)=>`<th data-col="${i}">${escapeHtml(h)}</th>`).join('')+'</tr>';
  const tb=$('tableBody');tb.innerHTML='';
  DAYS.forEach((day,d)=>{
    const tr=document.createElement('tr');
    const dayTd=document.createElement('td');dayTd.className='day-cell';dayTd.textContent=day;tr.appendChild(dayTd);
    S.headers.forEach((_,t)=>{
      const td=document.createElement('td');td.className='data-cell';
      const inp=document.createElement('input');
      inp.className='cell-input';inp.type='text';inp.value=S.grid[d][t];
      inp.dataset.d=d;inp.dataset.t=t;inp.autocomplete='off';inp.spellcheck=false;inp.placeholder='—';
      inp.addEventListener('input',()=>handleCellInput(inp));
      inp.addEventListener('focus',()=>{lastFocusTime=Date.now();if(hideTimer){clearTimeout(hideTimer);hideTimer=null}showSuggestions(inp)});
      inp.addEventListener('blur',()=>{hideTimer=setTimeout(()=>{hideSuggestions();hideTimer=null},200)});
      inp.addEventListener('keydown',e=>handleCellKey(e,inp));
      td.appendChild(inp);tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  refreshCells();
}
function updateCellStyle(inp){
  const d=+inp.dataset.d,t=+inp.dataset.t;
  const val=S.grid[d][t],color=val?S.colors[val]:null,td=inp.parentElement;
  td.classList.toggle('is-empty',!val);
  if(color){td.style.background=color;td.style.backgroundImage='none';inp.style.color=textColorFor(color)}
  else if(val){td.style.background='#fff';td.style.backgroundImage='none';inp.style.color='#1e293b'}
  else{td.style.background='';td.style.backgroundImage='';inp.style.color='#1e293b'}
}
function refreshCells(){document.querySelectorAll('.cell-input').forEach(updateCellStyle)}

function handleCellInput(inp){
  const pos=inp.selectionStart,fixed=enforcePersian(inp.value);
  if(fixed!==inp.value){inp.value=fixed;try{inp.setSelectionRange(pos,pos)}catch(_){}}
  const d=+inp.dataset.d,t=+inp.dataset.t,val=inp.value.trim();
  S.grid[d][t]=val;cleanupOrphans();
  if(val&&!(val in S.colors))S.colors[val]=nextColor();
  updateCellStyle(inp);renderClasses();showSuggestions(inp);
}
function handleCellKey(e,inp){
  const dd=$('autocomplete'),open=dd.style.display==='block';
  const items=open?dd.querySelectorAll('.autocomplete-item'):[];
  let active=dd.querySelector('.autocomplete-item.active');
  let idx=Array.from(items).indexOf(active);
  if(e.key==='Escape'){hideSuggestions();inp.blur()}
  else if(e.key==='Enter'){e.preventDefault();if(open&&active)applySuggestion(inp,active.dataset.name);else{hideSuggestions();inp.blur()}}
  else if(e.key==='ArrowDown'){if(!open||!items.length)return;e.preventDefault();idx=idx<items.length-1?idx+1:0;items.forEach(i=>i.classList.remove('active'));items[idx]?.classList.add('active')}
  else if(e.key==='ArrowUp'){if(!open||!items.length)return;e.preventDefault();idx=idx>0?idx-1:items.length-1;items.forEach(i=>i.classList.remove('active'));items[idx]?.classList.add('active')}
  else if(e.key==='Tab')hideSuggestions();
}

function showSuggestions(inp){
  const raw=inp.value.trim(),names=classNames();
  if(!names.length){hideSuggestions();return}
  const norm=normalizeForSearch(raw);
  const matches=names.filter(n=>{if(n===raw)return false;if(!norm)return true;const nn=normalizeForSearch(n);return nn.includes(norm)||norm.includes(nn)}).slice(0,8);
  if(!matches.length){hideSuggestions();return}
  const dd=$('autocomplete');dd.innerHTML='';
  matches.forEach((name,i)=>{
    const item=document.createElement('div');
    item.className='autocomplete-item'+(i===0?' active':'');item.dataset.name=name;
    item.innerHTML=`<span class="autocomplete-color" style="background:${S.colors[name]||'#f1f5f9'}"></span><span class="autocomplete-name">${highlightMatch(name,raw)}</span>`;
    item.addEventListener('mousedown',e=>{e.preventDefault();applySuggestion(inp,name)});
    dd.appendChild(item);
  });
  const r=inp.getBoundingClientRect();
  dd.style.display='block';dd.style.left=r.left+'px';dd.style.top=(r.bottom+2)+'px';dd.style.width=Math.max(r.width,180)+'px';
  requestAnimationFrame(()=>{const dr=dd.getBoundingClientRect();if(dr.bottom>innerHeight)dd.style.top=(r.top-dr.height-2)+'px';if(dr.left<8)dd.style.left='8px';if(dr.right>innerWidth-8)dd.style.left=(innerWidth-dr.width-8)+'px'});
}
function highlightMatch(original,query){
  if(!query)return escapeHtml(original);
  const nO=normalizeForSearch(original),nQ=normalizeForSearch(query);
  const start=nO.indexOf(nQ);if(start===-1)return escapeHtml(original);
  let pos=0,s=-1,e=-1;
  for(let i=0;i<original.length;i++){if(pos===start&&s===-1)s=i;pos+=normalizeForSearch(original[i]).length;if(pos===start+nQ.length&&e===-1){e=i+1;break}}
  if(s===-1||e===-1)return escapeHtml(original);
  return escapeHtml(original.slice(0,s))+'<mark>'+escapeHtml(original.slice(s,e))+'</mark>'+escapeHtml(original.slice(e));
}
const hideSuggestions=()=>{$('autocomplete').style.display='none'};
function applySuggestion(inp,name){inp.value=name;handleCellInput(inp);hideSuggestions()}

/* ============================================================
   Sidebar rendering
   ============================================================ */
function renderClasses(){
  const list=$('classList'),names=classNames();
  $('classCount').textContent=names.length?`(${names.length})`:'';
  if(!names.length){list.innerHTML='<li class="empty-classes">هنوز کلاسی وارد نشده است.</li>';return}
  const counts={};S.grid.forEach(row=>row.forEach(v=>{if(v)counts[v]=(counts[v]||0)+1}));
  list.innerHTML='';
  names.forEach(name=>{
    const li=document.createElement('li');li.className='class-item';
    const dot=document.createElement('button');dot.type='button';
    dot.className='class-dot'+(S.colors[name]?'':' unassigned');dot.title='تغییر رنگ';
    if(S.colors[name])dot.style.background=S.colors[name];
    dot.addEventListener('click',e=>{e.stopPropagation();openPicker(name,dot)});
    const nEl=document.createElement('span');nEl.className='class-name';nEl.contentEditable='true';
    nEl.textContent=name;nEl.dataset.original=name;nEl.spellcheck=false;
    nEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nEl.blur()}else if(e.key==='Escape'){nEl.textContent=nEl.dataset.original;nEl.blur()}});
    nEl.addEventListener('blur',()=>{const o=nEl.dataset.original,n=enforcePersian(nEl.textContent.trim());if(!n||n===o){nEl.textContent=o;return}renameClass(o,n)});
    const badge=document.createElement('span');badge.className='class-count';badge.textContent=counts[name]||0;
    li.appendChild(dot);li.appendChild(nEl);li.appendChild(badge);list.appendChild(li);
  });
}
function renameClass(o,n){
  const color=S.colors[o];delete S.colors[o];if(!(n in S.colors))S.colors[n]=color;
  S.grid=S.grid.map(row=>row.map(v=>v===o?n:v));
  document.querySelectorAll('.cell-input').forEach(inp=>{const d=+inp.dataset.d,t=+inp.dataset.t;inp.value=S.grid[d][t];updateCellStyle(inp)});
  renderClasses();
}
function openPicker(name,anchor){
  const pk=$('colorPicker'),cur=S.colors[name];pk.innerHTML='';
  const grid=document.createElement('div');grid.className='color-picker-grid';
  paletteColors().forEach(c=>{
    const b=document.createElement('button');b.type='button';
    b.className='color-swatch'+(c===cur?' active':'');b.style.background=c;
    b.addEventListener('click',()=>{assignColor(name,c);closePicker()});
    grid.appendChild(b);
  });
  pk.appendChild(grid);
  if(cur){
    const foot=document.createElement('div');foot.className='color-picker-footer';
    const u=document.createElement('button');u.className='unassign-btn';u.textContent='حذف رنگ';
    u.addEventListener('click',()=>{S.colors[name]=null;refreshCells();renderClasses();closePicker()});
    foot.appendChild(u);pk.appendChild(foot);
  }
  pk.style.display='block';
  const r=anchor.getBoundingClientRect(),pr=pk.getBoundingClientRect();
  let left=r.right+8,top=r.top;
  if(left+pr.width>innerWidth-8)left=r.left-pr.width-8;
  if(left<8)left=8;
  if(top+pr.height>innerHeight-8)top=innerHeight-pr.height-8;
  if(top<8)top=8;
  pk.style.left=left+'px';pk.style.top=top+'px';
}
const closePicker=()=>{$('colorPicker').style.display='none'};
function assignColor(name,color){
  for(const[k,v]of Object.entries(S.colors))if(v===color&&k!==name)S.colors[k]=null;
  S.colors[name]=color;refreshCells();renderClasses();
}

const PREVIEW={};for(const k in PALETTES)PREVIEW[k]=shuffle([...PALETTES[k].colors]).slice(0,5);
function renderPalettes(){
  const list=$('paletteList');list.innerHTML='';
  for(const[key,p]of Object.entries(PALETTES)){
    const li=document.createElement('li');
    li.className='palette-row'+(key===S.palette?' active':'');
    li.innerHTML=`<span class="palette-name">${p.label}</span><span class="palette-dots">${PREVIEW[key].map(c=>`<span class="palette-dot" style="background:${c}"></span>`).join('')}</span>`;
    li.addEventListener('click',()=>applyPalette(key));list.appendChild(li);
  }
}
function applyPalette(name){
  S.palette=name;const colors=paletteColors(),used=new Set();
  classNames().forEach(cn=>{const c=colors.find(x=>!used.has(x));if(c){S.colors[cn]=c;used.add(c)}else S.colors[cn]=null});
  renderPalettes();refreshCells();renderClasses();
}

function renderPresets(){
  const el=$('presetList');el.innerHTML='';
  PRESETS.forEach(p=>{
    const b=document.createElement('button');b.className='preset-btn';b.textContent=p.label;
    b.addEventListener('click',()=>applyPreset(p));el.appendChild(b);
  });
}
function renderHeaders(){
  const list=$('headerList');list.innerHTML='';
  S.headers.forEach((h,i)=>{
    const li=document.createElement('li');li.className='header-item';
    const inp=document.createElement('input');inp.className='header-input';inp.value=h;inp.spellcheck=false;
    inp.addEventListener('input',()=>{
      const pos=inp.selectionStart,fixed=enforcePersian(inp.value);
      if(fixed!==inp.value){inp.value=fixed;try{inp.setSelectionRange(pos,pos)}catch(_){}}
      S.headers[i]=inp.value;
      const th=document.querySelector(`#tableHead th[data-col="${i}"]`);if(th)th.textContent=inp.value;
    });
    const del=document.createElement('button');del.className='icon-btn';del.textContent='×';del.title='حذف ستون';
    del.addEventListener('click',()=>removeHeader(i));
    li.appendChild(inp);li.appendChild(del);list.appendChild(li);
  });
}
async function removeHeader(i){
  if(S.headers.length<=1){notify('حداقل یک ستون لازم است','error');return}
  const hasContent=S.grid.some(row=>row[i]);
  if(hasContent){const ok=await confirmDialog('این ستون حاوی اطلاعات است. حذف شود؟');if(!ok)return}
  S.headers.splice(i,1);S.grid.forEach(row=>row.splice(i,1));
  buildTable();renderHeaders();cleanupOrphans();renderClasses();notify('ستون حذف شد');
}
function addHeader(){
  S.headers.push('ستون '+(S.headers.length+1));S.grid.forEach(row=>row.push(''));
  buildTable();renderHeaders();notify('ستون اضافه شد','success');
}
function applyPreset(preset){
  S.headers=[...preset.headers];S.grid=S.grid.map(row=>preset.headers.map((_,i)=>row[i]||''));
  buildTable();renderHeaders();cleanupOrphans();renderClasses();notify('قالب ستون‌ها اعمال شد','success');
}

function randomize(){
  const names=classNames();if(!names.length){notify('ابتدا چند کلاس وارد کنید','error');return}
  const shuffled=shuffle(paletteColors());
  names.forEach((n,i)=>{S.colors[n]=shuffled[i%shuffled.length]});
  refreshCells();renderClasses();notify('رنگ‌بندی تصادفی اعمال شد','success');
}
async function clearAll(){
  const ok=await confirmDialog('همه کلاس‌ها پاک شوند؟');if(!ok)return;
  S.grid=DAYS.map(()=>S.headers.map(()=>''));S.colors={};
  document.querySelectorAll('.cell-input').forEach(inp=>{inp.value='';updateCellStyle(inp)});
  renderClasses();notify('همه پاک شد','success');
}

/* ============================================================
   EXPORT
   ============================================================ */

function resolveOrientation(){
  if(S.orientation === 'portrait' || S.orientation === 'landscape') return S.orientation;
  return S.headers.length > 6 ? 'landscape' : 'portrait';
}

/* Rewrite the *content* of the static print style element. This is the
   reliable way to change @page size at runtime in Chrome/Firefox. */
function applyPageRule(orientation){
  const el = document.getElementById('printPageRule');
  if(el) el.textContent = `@page { size: A4 ${orientation}; margin: 0; }`;
}

function buildExportPage(orientation){
  const { w, h } = A4[orientation];
  const pageH    = h - PAGE_SLACK;
  const contentW = w - MARGIN * 2;
  const contentH = pageH - MARGIN * 2;

  const page = document.createElement('div');
  page.className = 'export-page';
  page.style.width   = w + 'mm';
  page.style.height  = pageH + 'mm';
  page.style.padding = MARGIN + 'mm';

  let titleH = 0;
  if(S.exportTitle){
    titleH = TITLE_BLOCK;
    const head = document.createElement('div');
    head.className = 'export-head';
    head.style.height = titleH + 'mm';

    const t = document.createElement('div');
    t.className = 'export-head-title';
    t.textContent = 'برنامه هفتگی';

    const sub = document.createElement('div');
    sub.className = 'export-head-date';
    sub.textContent = persianDateLong();

    head.appendChild(t);
    head.appendChild(sub);
    page.appendChild(head);
  }

  const tableH   = contentH - titleH;
  const headRowH = Math.min(18, Math.max(11, tableH * 0.06));
  const dayRowH  = (tableH - headRowH) / DAYS.length;

  const dayColW  = Math.min(28, Math.max(18, contentW * 0.13));
  const dataColW = (contentW - dayColW) / S.headers.length;

  const table = document.createElement('table');
  table.className = 'export-table';
  table.style.height = tableH + 'mm';
  table.dataset.targetHeight = String(tableH);

  const cg = document.createElement('colgroup');
  const c0 = document.createElement('col'); c0.style.width = dayColW + 'mm'; cg.appendChild(c0);
  S.headers.forEach(() => {
    const c = document.createElement('col'); c.style.width = dataColW + 'mm'; cg.appendChild(c);
  });
  table.appendChild(cg);

  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  hr.style.height = headRowH + 'mm';

  const corner = document.createElement('th');
  corner.className = 'export-corner';
  corner.textContent = 'روز';
  hr.appendChild(corner);

  S.headers.forEach(hd => {
    const th = document.createElement('th');
    th.textContent = hd;
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  DAYS.forEach((day, d) => {
    const tr = document.createElement('tr');
    tr.style.height = dayRowH + 'mm';

    const dayTd = document.createElement('td');
    dayTd.className = 'export-day';
    dayTd.textContent = day;
    tr.appendChild(dayTd);

    S.headers.forEach((_, t) => {
      const val = S.grid[d][t];
      const color = val ? S.colors[val] : null;
      const td = document.createElement('td');
      td.className = 'export-cell';
      td.textContent = val || '';
      if(color){
        td.style.background = color;
        td.style.color = textColorFor(color);
      }
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  page.appendChild(table);

  return page;
}

function autofitExport(page){
  const table = page.querySelector('.export-table');
  if(!table) return;
  const targetMm = parseFloat(table.dataset.targetHeight || '0');
  if(!targetMm) return;
  const targetPx = targetMm * (96 / 25.4);

  let size = 14;
  table.style.fontSize = size + 'px';

  let guard = 0;
  while(page.scrollHeight > page.clientHeight && size > 8.5 && guard++ < 15){
    size -= 0.5;
    table.style.fontSize = size + 'px';
  }
}

/* Mount a fresh full-size export page off-screen. Used for print + PNG. */
function mountStage(orientation){
  const old = document.getElementById('exportStage');
  if(old) old.remove();

  const stage = document.createElement('div');
  stage.id = 'exportStage';
  stage.className = 'export-stage';

  const page = buildExportPage(orientation);
  stage.appendChild(page);
  document.body.appendChild(stage);

  autofitExport(page);
  return stage;
}
function unmountStage(){
  const s = document.getElementById('exportStage');
  if(s) s.remove();
}

/* ---------- Preview modal ---------- */
function openExportModal(){
  const overlay = $('exportModal');
  overlay.classList.add('show');
  renderModalControls();
  buildModalPreview();
}
function closeExportModal(){
  $('exportModal').classList.remove('show');
}
function renderModalControls(){
  document.querySelectorAll('#modalOrientSeg button').forEach(b=>{
    b.classList.toggle('active', b.dataset.v === S.orientation);
  });
  $('modalTitleToggle').checked = S.exportTitle;
}
function buildModalPreview(){
  const wrap = $('exportPreviewWrap');
  wrap.innerHTML = '';

  const orientation = resolveOrientation();
  const page = buildExportPage(orientation);

  /* Measure at natural size */
  page.style.position = 'absolute';
  page.style.left = '-20000px';
  page.style.top = '0';
  document.body.appendChild(page);

  autofitExport(page);

  const pw = page.offsetWidth;
  const ph = page.offsetHeight;

  /* Available viewport for the preview */
  const maxW = Math.min(window.innerWidth  * 0.88, 860) - 44;
  const maxH = Math.min(window.innerHeight * 0.62, 720);
  const scale = Math.min(maxW / pw, maxH / ph, 1);

  const holder = document.createElement('div');
  holder.className = 'export-preview-holder';
  holder.style.width  = (pw * scale) + 'px';
  holder.style.height = (ph * scale) + 'px';

  page.style.position = 'absolute';
  page.style.left = '0';
  page.style.top = '0';
  page.style.transformOrigin = 'top left';
  page.style.transform = `scale(${scale})`;
  page.style.margin = '0';

  holder.appendChild(page);
  wrap.appendChild(holder);
}

/* ---------- PNG at 300 dpi ---------- */
async function exportPNG(){
  closeExportModal();
  const overlay = $('exportModal');

  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r => requestAnimationFrame(r));

    const orientation = resolveOrientation();
    const stage = mountStage(orientation);
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    const page = stage.querySelector('.export-page');
    const shortEdge = Math.min(page.offsetWidth, page.offsetHeight);
    const scale = Math.max(1, PNG_SHORT_EDGE / shortEdge);

    const canvas = await html2canvas(page, {
      scale,
      backgroundColor: '#ffffff',
      useCORS: true,
      logging: false,
    });

    const data = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.download = `weekly-schedule-${dateStamp()}.png`;
    a.href = data;
    document.body.appendChild(a);
    a.click();
    a.remove();

    notify(`PNG ذخیره شد (${canvas.width}×${canvas.height})`, 'success');
  }catch(err){
    console.error(err);
    notify('خطا در ساخت تصویر', 'error');
  }finally{
    unmountStage();
    overlay.classList.remove('show');
  }
}

/* ---------- Print / Save as PDF ---------- */
async function printSchedule(){
  const overlay = $('exportModal');
  const btn = $('modalPrintBtn');
  const original = btn.innerHTML;
  btn.innerHTML = '⏳ آماده‌سازی...';
  btn.disabled = true;

  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;

    const orientation = resolveOrientation();

    /* 1. Update @page rule FIRST, before anything else */
    applyPageRule(orientation);

    /* 2. Mount the fresh full-size page off-screen */
    mountStage(orientation);

    /* 3. Hide the modal so it can't interfere */
    overlay.classList.remove('show');

    /* 4. Wait for layout + style recalculation, then print */
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await new Promise(r => setTimeout(r, 60));

    window.print();
  }catch(err){
    console.error(err);
    notify('خطا در آماده‌سازی چاپ', 'error');
  }finally{
    btn.innerHTML = original;
    btn.disabled = false;
  }
}

/* ============================================================
   Init
   ============================================================ */
function init(){
  buildTable();
  renderPalettes();
  renderPresets();
  renderHeaders();
  renderClasses();

  $('randomBtn').addEventListener('click', randomize);
  $('clearBtn').addEventListener('click', clearAll);
  $('addHeaderBtn').addEventListener('click', addHeader);

  /* Export modal */
  $('exportOpenBtn').addEventListener('click', openExportModal);
  $('modalCloseBtn').addEventListener('click', closeExportModal);
  $('modalPrintBtn').addEventListener('click', printSchedule);
  $('modalPngBtn').addEventListener('click', exportPNG);

  /* Click outside the modal card closes it */
  $('exportModal').addEventListener('mousedown', e => {
    if(e.target === $('exportModal')) closeExportModal();
  });

  /* Orientation inside the modal */
  $('modalOrientSeg').addEventListener('click', e => {
    const b = e.target.closest('button[data-v]');
    if(!b) return;
    S.orientation = b.dataset.v;
    saveSettings();
    renderModalControls();
    buildModalPreview();
  });

  /* Title toggle inside the modal */
  $('modalTitleToggle').addEventListener('change', e => {
    S.exportTitle = e.target.checked;
    saveSettings();
    buildModalPreview();
  });

  /* Rebuild the preview if the window resizes while the modal is open */
  addEventListener('resize', () => {
    hideSuggestions(); closePicker();
    if($('exportModal').classList.contains('show')) buildModalPreview();
  });

  /* Escape closes the modal */
  addEventListener('keydown', e => {
    if(e.key === 'Escape' && $('exportModal').classList.contains('show')){
      closeExportModal();
    }
  });

  addEventListener('scroll', () => {
    if(Date.now() - lastFocusTime < 600) return;
    hideSuggestions();
    closePicker();
  }, true);

  document.addEventListener('mousedown', e => {
    if($('autocomplete').contains(e.target)) return;
    if(!(e.target.closest && e.target.closest('.data-cell'))) hideSuggestions();
    if(!$('colorPicker').contains(e.target) && !e.target.classList.contains('class-dot')) closePicker();
  });

  /* Ctrl+P / browser print: make sure we always have a valid document */
  addEventListener('beforeprint', () => {
    const orientation = resolveOrientation();
    applyPageRule(orientation);
    mountStage(orientation);
  });
  addEventListener('afterprint', () => {
    /* Only clean up if the user didn't trigger our own print flow */
    unmountStage();
  });
}

init();
</script>
